# Local stack: gateway + Jaeger (OpenTelemetry traces at http://localhost:16686).
services:
  jaeger:
    image: jaegertracing/jaeger:2.10.0
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP/HTTP

  gateway:
    build: .
    image: mcp-gateway:local
    ports:
      - "8080:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    volumes:
      - ./evals/tasks/injection-exfiltrate-secrets/environment/workspace:/app/workspace
    depends_on: [jaeger]
